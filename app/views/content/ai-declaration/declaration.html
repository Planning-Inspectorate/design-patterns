{% extends "govuk-prototype-kit/layouts/unbranded.html" %}

{% block pageTitle %}
Declaration
{% endblock %}

{% block content %}
<div class="govuk-grid-row" style="margin-top: 20px">
  <div class="govuk-grid-column-two-thirds-from-desktop">
    <div class="govuk-form-group">
      <fieldset class="govuk-fieldset">
        <legend class="govuk-fieldset__legend govuk-fieldset__legend--m">
          <h2 class="govuk-fieldset__heading">Declaration</h2>
        </legend>

        <div class="govuk-checkboxes" data-module="govuk-checkboxes">
          <div class="govuk-checkboxes__item">
            <input class="govuk-checkboxes__input" id="ai-declaration" name="aiDeclaration" type="checkbox" value="confirmed">
            <label class="govuk-label govuk-checkboxes__label" for="ai-declaration">
              I have checked any content generated by artificial intelligence (AI) is accurate and reflects my views
            </label>
          </div>
        </div>
      </fieldset>
    </div>
  </div>
</div>
{% endblock %}
